<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg: oklch(97% 0.008 95);
      --panel: oklch(99.5% 0.003 95);
      --ink: oklch(22% 0.015 95);
      --ink-muted: oklch(52% 0.012 95);
      --line: oklch(88% 0.008 95);
      --accent: oklch(48% 0.09 160);
      --accent-soft: oklch(93% 0.035 160);
      --bad: oklch(55% 0.1 30);
      --bad-soft: oklch(95% 0.025 30);
      --font-display: Georgia, 'Noto Serif KR', serif;
      --font-body: 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); } a:hover { color: oklch(38% 0.09 160); }
    .slide{ width:1280px; height:720px; background:var(--bg); color:var(--ink); font-family:var(--font-body); position:relative; display:flex; flex-direction:column; padding:64px 96px; }
    .head{ display:flex; align-items:baseline; gap:16px; }
    .num{ font-family:var(--font-display); font-size:28px; color:var(--accent); font-weight:600; }
    .kicker{ font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-muted); }
    .time{ margin-left:auto; font-size:14px; color:var(--ink-muted); }
    .h1{ font-family:var(--font-display); font-size:36px; font-weight:600; margin:10px 0 40px; }
    .panels{ display:flex; gap:28px; flex:1; }
    .panel{ flex:1; background:var(--panel); border:1px solid var(--line); padding:36px; display:flex; flex-direction:column; gap:18px; }
    .panel-label{ font-size:15px; font-weight:700; letter-spacing:0.02em; }
    .panel.good .panel-label{ color:var(--accent); }
    .panel.bad .panel-label{ color:var(--bad); }
    .panel-line{ font-size:22px; line-height:1.55; color:var(--ink); }
    .caption{ margin-top:32px; font-size:15px; color:var(--ink-muted); line-height:1.6; max-width:820px; }
    .caption b{ color:var(--ink); }
    .footer{ position:absolute; left:96px; right:96px; bottom:32px; display:flex; justify-content:space-between; font-size:13px; color:var(--ink-muted); border-top:1px solid var(--line); padding-top:14px; }
  </style>
</helmet>
<div class="slide">
  <div class="head">
    <span class="num">01</span>
    <span class="kicker">결론 먼저</span>
    <span class="time">25초</span>
  </div>
  <div class="h1">[결론 문장 — 직접 작성]</div>

  <div class="panels">
    <div class="panel good">
      <div class="panel-label">증명한 것</div>
      <div class="panel-line">사용자가 담당 채널을 모른다는 것</div>
      <div class="panel-line">그리고 이 방식이 아주 적은 비용으로 도입된다는 것</div>
    </div>
    <div class="panel bad">
      <div class="panel-label">못 한 것</div>
      <div class="panel-line">안내가 실제로 사용자를 돕는지는 재지 못했다</div>
      <div class="panel-line">일반화 근거는 NH 사례 하나뿐이다 — 다른 회사·업종은 확인하지 못했다</div>
    </div>
  </div>

  <div class="caption">왜 먼저 말하나 — <b>5분 안에 신뢰를 잃지 않기 위해서다.</b> `HANDOFF.md`에도 "발표에서 먼저 말해야 한다"고 적어뒀다.</div>

  <div class="footer">
    <span>NH인앱검색 · 발표자료_구성안.md §1</span>
    <span>1 / 8</span>
  </div>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
